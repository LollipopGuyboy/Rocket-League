<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>3D Car Soccer Advanced</title>
  <style>
    html,body { margin:0; height:100%; background:#111; overflow:hidden; }
    #ui { position:absolute; top:10px; left:10px; color:#fff; font-family:Arial; }
    #difficulty { margin-top:8px; }
  </style>
</head>
<body>
<div id="ui">
  <div id="score">Score: 0 - 0</div>
  <label>AI Difficulty:
    <select id="difficulty">
      <option value="beginner">Beginner</option>
      <option value="advanced">Advanced</option>
    </select>
  </label>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"></script>

<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x202020);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 2000);
camera.position.set(0,8,18);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Lights
scene.add(new THREE.AmbientLight(0xffffff,0.5));
const dir = new THREE.DirectionalLight(0xffffff,1);
dir.position.set(10,20,10);
scene.add(dir);

// Physics world
const world = new CANNON.World({gravity:new CANNON.Vec3(0,-9.82,0)});
world.solver.iterations = 10;

// Ground
const groundMesh = new THREE.Mesh(new THREE.PlaneGeometry(50,30), new THREE.MeshLambertMaterial({color:0x228B22}));
groundMesh.rotation.x = -Math.PI/2;
scene.add(groundMesh);
const groundBody = new CANNON.Body({mass:0});
groundBody.addShape(new CANNON.Plane());
groundBody.quaternion.setFromEuler(-Math.PI/2,0,0);
world.addBody(groundBody);

// Ball
const ballMesh = new THREE.Mesh(new THREE.SphereGeometry(1,32,32), new THREE.MeshStandardMaterial({color:0xffffff}));
scene.add(ballMesh);
const ballBody = new CANNON.Body({mass:1,shape:new CANNON.Sphere(1),position:new CANNON.Vec3(0,2,0)});
world.addBody(ballBody);

// Car
const carMesh = new THREE.Mesh(new THREE.BoxGeometry(2,1,4), new THREE.MeshStandardMaterial({color:0x1e90ff}));
scene.add(carMesh);
const carBody = new CANNON.Body({mass:6,shape:new CANNON.Box(new CANNON.Vec3(1,0.5,2)),position:new CANNON.Vec3(0,1.2,10)});
world.addBody(carBody);

// AI Car
const aiMesh = new THREE.Mesh(new THREE.BoxGeometry(2,1,4), new THREE.MeshStandardMaterial({color:0xff4444}));
scene.add(aiMesh);
const aiBody = new CANNON.Body({mass:6,shape:new CANNON.Box(new CANNON.Vec3(1,0.5,2)),position:new CANNON.Vec3(0,1.2,-10)});
world.addBody(aiBody);

// Goal posts with nets
function makeGoal(z){
  const postMat = new THREE.MeshStandardMaterial({color:0xffffff});
  const leftPost = new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,3),postMat);
  leftPost.position.set(-4,1.5,z); scene.add(leftPost);
  const rightPost = new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,3),postMat);
  rightPost.position.set(4,1.5,z); scene.add(rightPost);
  const crossbar = new THREE.Mesh(new THREE.BoxGeometry(8,0.2,0.2),postMat);
  crossbar.position.set(0,3,z); scene.add(crossbar);
  // Net plane (bouncy)
  const netBody = new CANNON.Body({mass:0});
  netBody.addShape(new CANNON.Box(new CANNON.Vec3(4,2,0.2)));
  netBody.position.set(0,1.5,z+(z>0?0.2:-0.2));
  world.addBody(netBody);
}
makeGoal(-15);
makeGoal(15);

// Controls
const keys={};
window.addEventListener('keydown',e=>keys[e.code]=true);
window.addEventListener('keyup',e=>keys[e.code]=false);

// Boost trail particles
const trailGeo = new THREE.BufferGeometry();
const trailCount = 100;
const positions = new Float32Array(trailCount*3);
trailGeo.setAttribute('position', new THREE.BufferAttribute(positions,3));
const trailMat = new THREE.PointsMaterial({color:0x00ffff,size:0.2});
const trail = new THREE.Points(trailGeo,trailMat);
scene.add(trail);

// Score
let scoreLeft=0, scoreRight=0;
function updateScore(){document.getElementById('score').textContent=`Score: ${scoreLeft} - ${scoreRight}`;}

// AI difficulty
function aiLogic(){
  const diff = document.getElementById('difficulty').value;
  const target = ballBody.position.clone();
  const dir = target.vsub(aiBody.position);
  if(diff==='beginner'){
    dir.scale(0.5); // slower reaction
  } else {
    dir.scale(1.2); // aggressive
  }
  aiBody.applyForce(dir, aiBody.position);
}

// Game loop
function animate(){
  requestAnimationFrame(animate);
  // Controls
  const force=150;
  if(keys['KeyW']) carBody.applyForce(new CANNON.Vec3(0,0,-force),carBody.position);
  if(keys['KeyS']) carBody.applyForce(new CANNON.Vec3(0,0,force),carBody.position);
  if(keys['KeyA']) carBody.applyForce(new CANNON.Vec3(-force,0,0),carBody.position);
  if(keys['KeyD']) carBody.applyForce(new CANNON.Vec3(force,0,0),carBody.position);
  if(keys['Space']){
    carBody.applyForce(new CANNON.Vec3(0,0,-force*3),carBody.position);
    // trail effect
    for(let i=trailCount-1;i>0;i--){
      positions[i*3]=positions[(i-1)*3];
      positions[i*3+1]=positions[(i-1)*3+1];
      positions[i*3+2]=positions[(i-1)*3+2];
    }
    positions[0]=carBody.position.x;
    positions[1]=carBody.position.y;
    positions[2]=carBody.position.z;
    trailGeo.attributes.position.needsUpdate=true;
  }

  aiLogic();

  world.step(1/60);

  ballMesh.position.copy(ballBody.position);
  carMesh.position.copy(carBody.position);
  aiMesh.position.copy(aiBody.position);

  camera.position.lerp(new THREE.Vector3(carBody.position.x,carBody.position.y+6,carBody.position.z+12),0.1);
  camera.lookAt(carBody.position);

  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
